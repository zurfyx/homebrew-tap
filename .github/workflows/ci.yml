name: Tap CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate every formula
        run: |
          set -eu
          brew tap zurfyx/tap "$GITHUB_WORKSPACE"
          for file in Formula/*.rb; do
            name=$(basename "$file" .rb)
            echo "::group::$name"
            ruby -c "$file"
            brew style "$file"
            # A formula still on its all-zero template checksum has nothing to install.
            if ! grep -Eq 'sha256 "0{64}"' "$file"; then
              brew install "zurfyx/tap/$name"
              brew test "zurfyx/tap/$name"
            fi
            echo "::endgroup::"
          done
      - name: Validate every cask
        run: |
          set -eu
          brew tap zurfyx/tap "$GITHUB_WORKSPACE" 2>/dev/null || true
          for file in Casks/*.rb; do
            [ -e "$file" ] || continue
            name=$(basename "$file" .rb)
            echo "::group::$name"
            ruby -c "$file"
            brew style "$file"
            # A cask still on its all-zero template checksum has nothing to install.
            if ! grep -Eq 'sha256 "0{64}"' "$file"; then
              brew install --cask "zurfyx/tap/$name"
              brew uninstall --cask "zurfyx/tap/$name"
            fi
            echo "::endgroup::"
          done
